[project]
name = "pagedrop"
version = "0.1.0"
description = "Drag PDF pages into folders from a thumbnail grid"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "PyMuPDF>=1.24.0",
    "pypdf[crypto]>=4.2.0",
]

[project.scripts]
pagedrop = "pagedrop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pagedrop"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyqt6"
timeout = 60
timeout_method = "thread"
