[project]
name = "pagedrop"
version = "0.3.0"
description = "Grab PDF pages and drop them where they belong — folders, merges, multi-tab edits"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "PyMuPDF>=1.24.0",
]

[project.scripts]
pagedrop = "pagedrop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pagedrop"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.3.1",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyqt6"
timeout = 60
timeout_method = "thread"
addopts = ["--strict-markers"]
markers = [
    "office_com: real Microsoft Office COM conversion (set PAGEDROP_OFFICE_COM=1)",
    "libreoffice: real LibreOffice conversion (set PAGEDROP_LO_PATH or install soffice)",
    "tessdata: real tessdata languages available for OCR tests",
]
