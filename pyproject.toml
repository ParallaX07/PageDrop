[project]
name = "pagedrop"
version = "0.5.0"
description = "Grab PDF pages and drop them where they belong — folders, merges, multi-tab edits"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "PyMuPDF>=1.24.0",
]

[project.scripts]
pagedrop = "pagedrop.main:main"

[project.optional-dependencies]
# Windows-only Office COM pack — not installed on Linux/macOS wheels.
office = [
    "pywin32>=306; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pagedrop"]

[tool.hatch.build.targets.wheel.force-include]
"src/pagedrop/data" = "pagedrop/data"
"src/pagedrop/assets" = "pagedrop/assets"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.0",
    "pyinstaller>=6.0",
]
# Optional local install: `uv sync --group office` (no-op deps on non-Windows).
office = [
    "pywin32>=306; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyqt6"
timeout = 60
timeout_method = "thread"
addopts = ["--strict-markers", "-n", "auto"]
markers = [
    "office_com: real Microsoft Office COM conversion (set PAGEDROP_OFFICE_COM=1)",
    "libreoffice: real LibreOffice conversion (set PAGEDROP_LO_PATH or install soffice)",
    "tessdata: real tessdata languages available for OCR tests",
]
