# PageDrop CI — packaging gate + full pytest suite on Ubuntu and Windows.
# Optional backends (Office COM, LibreOffice, tessdata) and PyInstaller are
# intentionally unset; those tests skip without PAGEDROP_* env vars.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # PyQt6 wheels dlopen libEGL/libGL/XCB at import time even with
      # QT_QPA_PLATFORM=offscreen; ubuntu-latest does not ship them.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Packaging check
        run: uv run python scripts/check_packaging.py

      - name: Full test suite
        run: uv run python all_tests.py
