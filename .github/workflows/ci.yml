# PageDrop CI — packaging gate + full pytest suite on Ubuntu and Windows, plus a
# Linux PyInstaller build whose frozen helper re-entry flags are probed.
# Python codecs (openpyxl, Pillow) are installed; Office COM, LibreOffice and
# tessdata are intentionally unset, and those tests skip without PAGEDROP_* env vars.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      # PyQt6 wheels dlopen libEGL/libGL/XCB at import time even with
      # QT_QPA_PLATFORM=offscreen; ubuntu-latest does not ship them.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev --group codecs

      - name: Lint
        run: uv run ruff check src tests

      - name: Packaging check
        run: uv run python scripts/check_packaging.py

      - name: Build wheel
        run: uv build --wheel

      - name: Full test suite
        run: uv run python all_tests.py

  package-linux:
    name: package (ubuntu-latest, py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --group dev --group codecs

      - name: Build onedir bundle
        run: uv run pyinstaller --noconfirm pagedrop.spec

      - name: Packaging check
        run: uv run python scripts/check_packaging.py

      # Invoked through bash: the script is not committed with the executable bit.
      - name: Executable alive check
        run: bash scripts/smoke_exe.sh --skip-build

      - name: Frozen helper probes
        env:
          PAGEDROP_EXE: dist/pagedrop/pagedrop
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest tests/smoke/test_phase16_executable.py -v -n 0
